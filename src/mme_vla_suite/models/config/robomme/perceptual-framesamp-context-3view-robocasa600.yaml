# RoboMME perceptual FrameSample + Context baseline for the 600-episode RoboCasa store.
# Historical observations are projected to VLA width and prepended as input tokens.
# 480 / (3 views * 16 pooled patches) keeps ten uniformly sampled history frames.
budget: 480
num_views: 3
token_per_image: 16
streaming_obs_horizon: 16
pool_type: mean
use_pos_emb: true
use_state_emb: false
memory_use_time: false
memory_feature:
  img:
    net: identity
    input_dim: 2048
  pos:
    input_dim: 768
    hidden_dim: 768
  state:
    input_dim: 16
    hidden_dim: 512
integration_type: context
memory_token_dim: 2048
representation_type: perceptual
perceptual_memory:
  type: frame_sampling
