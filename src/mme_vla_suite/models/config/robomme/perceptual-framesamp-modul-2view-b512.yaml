# Frame-skip + memory-as-modulator, WRIST-ABLATION variant.
# Isolates the effect of adding the wrist camera to memory, vs the 1-view baseline:
#   num_views: 2          -> memory uses agentview_center + wrist (eye_in_hand)
#   use_state_emb: false  -> NO per-frame state in memory (unlike the time2v variant)
#   memory_use_time: false-> NO Time2Vec (unlike the time2v variant)
# budget 512 with num_views=2 / token_per_image 16 -> 512/(16*2)=16 frames sampled.
# View-2 (wrist) shares view-1's temporal index, distinguished only by slot.
budget: 512
num_views: 2
token_per_image: 16
streaming_obs_horizon: 16
pool_type: mean
use_pos_emb: true
use_state_emb: false
memory_use_time: false
memory_feature:
  img:
    net: identity
    input_dim: 2048
  pos:
    input_dim: 768
    hidden_dim: 768
  state:
    input_dim: 16
    hidden_dim: 512
integration_type: modulation
memory_token_dim: 1024
representation_type: perceptual
perceptual_memory:
  type: frame_sampling
