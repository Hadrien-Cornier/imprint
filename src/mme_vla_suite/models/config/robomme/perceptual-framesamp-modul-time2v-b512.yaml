# Frame-skip + memory-as-modulator, TIME-AWARE + 2-view variant.
# Add-ons over perceptual-framesamp-modul (all individually gated):
#   use_state_emb: true   -> per-frame robot state flows into each memory token
#   memory_use_time: true -> Time2Vec(episode-elapsed fraction) concatenated into each
#                            memory token (targets timing tasks like MemHeatPot)
#   num_views: 2          -> memory uses agentview_center + wrist (eye_in_hand)
# budget 512 with num_views=2 / token_per_image 16 -> 512/(16*2)=16 frames sampled
# (half the frames of the budget-1024 variant, ~half the per-step cost). View-2 (wrist)
# shares view-1's temporal index, distinguished only by slot (no explicit view embedding).
budget: 512
num_views: 2
token_per_image: 16
streaming_obs_horizon: 16
pool_type: mean
use_pos_emb: true
use_state_emb: true
memory_use_time: true
memory_feature:
  img:
    net: identity
    input_dim: 2048
  pos:
    input_dim: 768
    hidden_dim: 768
  state:
    input_dim: 16
    hidden_dim: 512
  time:
    out_dim: 32
    hidden_dim: 128
integration_type: modulation
memory_token_dim: 1024
representation_type: perceptual
perceptual_memory:
  type: frame_sampling
