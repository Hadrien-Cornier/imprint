budget: 256
num_views: 2
streaming_obs_horizon: 16
integration_type: modulation
memory_token_dim: 1024
representation_type: cosmo_bottleneck
memory_feature:
  img:
    net: identity
    input_dim: 768
  pos:
    input_dim: 768
    hidden_dim: 768
  state:
    input_dim: 8
    hidden_dim: 512
cosmo_bottleneck_memory:
  visual_feature_stream: dinov3
  latent_source: offline
  n_variants: 8
  num_query_samples: 16
  variant: Wan2.2-TI2V-5B
  temporal_factor: 4
  downsample: 2
  num_latents: 256
  num_cross_blocks: 2
  num_heads: 8
  cosmos_latent_dim: 48
  siglip_dim: 768
  proprio_in_dim: 8
  proprio_encoding: raw
  action_in_dim: 8
  action_encoding: raw
  lang_emb_dim: 2048
  action_tokenizer_hidden: 512
  proprio_tokenizer_hidden: 512
  episode_cache_size: 400
  pool_hw: 2
  wan_h: 256
  wan_w: 256
  latent_cap: 4096
  max_recent_tokens: 768
  max_step_tokens: 1244
cosmo_decoder:
  num_heads: 8
  num_blocks: 2
  align_dim: 768
  align_num_patches: 128
  ffn_inner: 8192
  action_dim: 8
  proprio_dim: 8
  max_query_steps: 2048
