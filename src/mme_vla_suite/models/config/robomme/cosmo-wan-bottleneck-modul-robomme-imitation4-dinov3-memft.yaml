  stride_choices:
    - 1
    - 2
    - 3
  interval_jitter: 1
  canonical_downsample: 2
stream_aug:
  enabled: false
  gauss_sigma: 0.05
  stream_drop_p: 0.1
  feat_drop_p: 0.0
