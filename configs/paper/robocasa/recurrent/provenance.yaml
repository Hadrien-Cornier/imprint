benchmark: robocasa
architecture: gated_delta_hybrid_v1
visual_stream: dinov3
base_policy: pi0.5
release:
  model_repo: Amazon-FAR/imprint_models
  model_path_prefix: simulation/robocasa/recurrent
  dataset_repo: Amazon-FAR/imprint_datasets
  dataset_path_prefix: simulation/robocasa/600
  revision: main
dataset:
  episodes: 600
  tasks: 12
  store: robocasa-600/store
stage1:
  trained_steps: 180000
  selected_step: 160000
  scan: chunkwise_wy
  compute_dtype: bfloat16
  loss_weights:
    alignment: 1.0
    action: 0.5
    proprio: 0.5
    progress: 0.5
stage2:
  trained_steps: 150000
  memory_encoder: finetuned
  auxiliary_loss_weight: 0.0
  legacy_history_aux_preload_flag: 0.25
  frozen:
    - image_encoder
evaluation:
  consolidate_all: true
  memory_inference: incremental_recurrent
  prediction_horizon: 20
  execution_horizon: 20
caps:
  latent: 4096
  recent: 768
  action_proprio: 1776
