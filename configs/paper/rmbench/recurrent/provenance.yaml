benchmark: rmbench
architecture: gated_delta_hybrid_v1
visual_stream: dinov3
base_policy: pi0.5
release:
  model_repo: Amazon-FAR/imprint_models
  model_path_prefix: simulation/rmbench/recurrent
  dataset_repo: Amazon-FAR/imprint_datasets
  dataset_path_prefix: simulation/rmbench/450
  revision: main
dataset:
  episodes: 450
  tasks: 9
  stage1_store: rmbench-450/stage1
  stage2_store: rmbench-450/stage2
stage1:
  trained_steps: 160000
  selected_step: 160000
  scan: chunkwise_wy
  compute_dtype: bfloat16
  latent_buckets:
    - 256
    - 512
    - 1024
    - 2048
    - 4096
  length_bucketed_batches: true
  loss_weights:
    alignment: 1.0
    action: 0.5
    proprio: 0.5
    progress: 0.5
stage2:
  trained_steps: 100000
  memory_encoder: finetuned
  frozen:
    - image_encoder
evaluation:
  consolidate_all: true
  memory_inference: incremental_recurrent
  prediction_horizon: 50
  execution_horizon: 50
  policy_input_color_order: bgr
caps:
  latent: 4096
  recent: 768
  action_proprio: 1244
release_retraining:
  deterministic_gpu_ops: true
  seeded_stage2_history_sampling: true
historical_checkpoint:
  deterministic_gpu_ops: false
  stage2_history_sampling: legacy_process_entropy
